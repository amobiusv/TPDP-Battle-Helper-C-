
[MAIN]

# Name of the title atop the window for the game
# Can define a list of possible names in case modded or DLC change the title
game_title = [
	"TPDP Shard of Dreams",
	"TPDP v1.",
	"幻想人形演舞 -梦之碎片-"
]

[DIMENSIONS]

# The aspect ratio of the window generated.
# Keep in mind the program was only really intended to work at 16:9, so other sizes might screw the layout.
window_aspect_ratio = "16:9"

# The height (in pixels) of the title bar.
# If information is getting either cropped out or not reaching around the bottom, change this.
titlebar_height = 40

# Value to avoid info getting cropped on the right.
# If information is getting either cropped out or not reaching around the right, change this.
window_width_offset = 16

[REFRESH_RATE]

# The frequency with which the tool's position on the screen should be updated to match the game's position
reposition_refresh_rate = 30

# The frequency with which the content inside the tool should be refreshed
content_refresh_rate = 30

[ADDRESSES]

# Memory addresses (absolute VAs, read as module base + value), one per game build.
# Defaults below were verified in-game to work for BOTH the AI-translated build
# (sod_extended.exe) and the 4.0 human-translated build (SoD-Extended-CN-Final.exe)
# — their data layouts are identical. If a future game build shifts offsets,
# override here (hex literals supported) without recompiling.
battle_flag = 0x93C0DF          # u8: 0 = not in battle, non-zero = in battle
battle_context_menu = 0x93C164  # u8: 2 = move menu, 10-19 = command menu
map_id = 0x9969BC               # u16 overworld map id
player_puppet = 0xC59FDB        # u16 active player puppet id, style byte at +2
enemy_puppet = 0xC5A510         # u16 active enemy puppet id, style byte at +2
player_skills = 0xC59FED        # 4 x u16 player skill ids